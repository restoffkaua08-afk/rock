[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rock-ai"
version = "0.1.0"
description = "Terminal-first multi-model AI orchestration runtime."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Kauã Restoff"}]
dependencies = [
  "httpx>=0.28,<1",
  "litellm>=1.75,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.13,<1",
]

[project.scripts]
rock = "rock.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rock"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Typer intentionally uses factory calls such as typer.Argument/Option in function defaults.
ignore = ["B008"]
